# Adaptive Eb/N0 grid: parallel runner only (runners.ber_vs_ebn0_parallel)
defaults: &common
  mod_order: 4
  grid:
    num_sc: 64
    num_blocks: 8
    scs_hz: 15000
  channel:
    paths:
      - {delay_us: 10, avg_gain_db: -3.0}
      - {delay_us: 5, avg_gain_db: -6.0}
      - {delay_us: 2.1, avg_gain_db: -4.0}
    max_doppler_hz: 1500
    doppler_mode: jakes
    fading: rayleigh
  noise:
    adaptive:
      start_db: 0
      stop_db: 40
      num_coarse_pts: 9          # every 5 dB
      min_step_db: 0.5           # lattice and finest step
      max_log10_ber_step: 0.5    # refine where BER drops by more than 0.5 decade
      min_ber: 1.0e-5            # curve end treshold
      max_rounds: 4
    count_cp_energy: false
  seed: 0
  num_trials: 10000              # maximum per point; early stop at --target-err

tests:
  ofdm_mmse_full:
    <<: *common
    waveform:
      type: ofdm
      cp_len: 0.25
    equalizer:
      type: mmse_full
  afdm_mmse:
    <<: *common
    waveform:
      type: afdm
      cp_len: 0.25
    equalizer:
      type: mmse_full
