defaults: &common
  mod_order: 4
  grid:
    num_sc: 64
    num_blocks: 8
    scs_hz: 15000
  channel:
    paths:
      - {delay_us: 0.0, avg_gain_db: 0.0}
      - {delay_us: 1.5, avg_gain_db: -3.0}
      - {delay_us: 1.7, avg_gain_db: -6.0}
      - {delay_us: 2.1, avg_gain_db: -4.0}
    max_doppler_hz: 1500
    doppler_mode: jakes
    fading: rayleigh
  noise:
    snr_db: [0, 2, 4, 6, 8, 10]
    count_cp_energy: false
  num_trials: 1000

tests:
  ofdm_mmse_full:
    <<: *common
    waveform:
      type: ofdm
      cp_len: 0.25
    equalizer:
      type: mmse_full
  ofdm_mmse_diag:
    <<: *common
    waveform:
      type: ofdm
      cp_len: 0.25
    equalizer:
      type: mmse_diag
  afdm_mmse:
    <<: *common
    waveform:
      type: afdm
      cp_len: 0.25
    equalizer:
      type: mmse_full